[package]
name = "orbifon"
version = "0.1.0"
edition = "2021"

# NOTE: This crate list is MIT/Apache-2.0 licensed throughout — no AGPL
# dependencies, per the project's closed-source commercial constraint.

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid", "migrate", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"
rust_decimal = { version = "1", features = ["serde"] }
regex = "1"
once_cell = "1"
